include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  errors:
    # DropdownButtonFormField.value keeps the app compatible with older Flutter
    # SDKs that do not expose the newer initialValue parameter.
    deprecated_member_use: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
