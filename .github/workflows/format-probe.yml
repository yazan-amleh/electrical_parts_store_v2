name: Temporary Dart format probe

'on':
  push:
    branches:
      - v2/foundation

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format and print diff
        run: |
          dart format lib test
          git diff --no-ext-diff -- lib test
