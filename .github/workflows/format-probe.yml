name: Temporary Dart format probe

on:
  push:

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=show lib/features/payments/presentation/party_payments_page.dart
