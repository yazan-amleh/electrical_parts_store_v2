name: Format probe

on:
  push:
    branches:
      - "v2/**"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format target files
        run: dart format lib/features/inventory/presentation/product_editor_dialog.dart lib/features/inventory/presentation/products_page.dart
      - name: Print formatted files
        run: |
          echo FORMAT_EDITOR_BEGIN
          cat lib/features/inventory/presentation/product_editor_dialog.dart
          echo FORMAT_EDITOR_END
          echo FORMAT_PRODUCTS_BEGIN
          cat lib/features/inventory/presentation/products_page.dart
          echo FORMAT_PRODUCTS_END
