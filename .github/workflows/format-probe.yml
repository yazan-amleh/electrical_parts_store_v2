name: Inventory format probe

on:
  push:
    branches:
      - "v2/**"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format target files
        run: dart format lib/features/inventory/data/mappers/inventory_movement_firestore_mapper.dart lib/features/inventory/domain/repositories/inventory_repository.dart lib/features/inventory/data/repositories/firestore_inventory_repository.dart lib/features/inventory/presentation/inventory_movements_page.dart lib/features/shell/presentation/app_shell_page.dart
      - name: Print formatted files
        run: |
          echo FORMAT_0_BEGIN
          cat lib/features/inventory/data/mappers/inventory_movement_firestore_mapper.dart
          echo FORMAT_0_END
          echo FORMAT_1_BEGIN
          cat lib/features/inventory/domain/repositories/inventory_repository.dart
          echo FORMAT_1_END
          echo FORMAT_2_BEGIN
          cat lib/features/inventory/data/repositories/firestore_inventory_repository.dart
          echo FORMAT_2_END
          echo FORMAT_3_BEGIN
          cat lib/features/inventory/presentation/inventory_movements_page.dart
          echo FORMAT_3_END
          echo FORMAT_4_BEGIN
          cat lib/features/shell/presentation/app_shell_page.dart
          echo FORMAT_4_END
