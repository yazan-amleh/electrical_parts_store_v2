name: Single format probe

on:
  push:
    branches:
      - "v2/**"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/inventory/presentation/inventory_movements_page.dart
      - run: |
          echo FORMAT_PAGE_BEGIN
          cat lib/features/inventory/presentation/inventory_movements_page.dart
          echo FORMAT_PAGE_END
