name: Temporary payment format capture

on:
  push:
    branches: [v2/foundation]

jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          dart format lib/features/payments/presentation/party_payments_page.dart
          echo FILE_BEGIN
          base64 -w0 lib/features/payments/presentation/party_payments_page.dart
          echo
          echo FILE_END
