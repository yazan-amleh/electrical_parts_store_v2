name: Firebase production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out V2
        uses: actions/checkout@v4
        with:
          ref: v2/port-v1-complete

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Cloud Functions syntax
        run: node --check functions/index.js

      - name: Deploy V2 Firebase resources
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: >
          firebase deploy
          --project electrical-store-v2-prod
          --only firestore:rules,firestore:indexes,storage,functions
          --non-interactive

      - name: Run production smoke test
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_STORE_ID: v2-dev-store
        run: node tools/production_smoke_test.mjs

      - name: List deployed functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase functions:list --project electrical-store-v2-prod
