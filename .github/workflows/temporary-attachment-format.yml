name: Temporary attachment format diff

on:
  push:
    branches:
      - v2/foundation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format attachment files and print diff
        run: |
          dart format lib/features/chat/data/repositories/firebase_chat_attachment_repository.dart lib/features/chat/domain/repositories/chat_attachment_repository.dart
          git diff -- lib/features/chat/data/repositories/firebase_chat_attachment_repository.dart lib/features/chat/domain/repositories/chat_attachment_repository.dart
