name: One-time Dart formatting

on:
  push:
    branches:
      - v2/foundation

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply official Dart formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply official Dart formatting
        run: dart format lib test

      - name: Commit formatted files
        run: |
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: apply official Dart formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
