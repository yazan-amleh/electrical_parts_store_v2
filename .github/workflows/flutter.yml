name: Flutter checks

on:
  push:
    branches:
      - main
      - "v2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Print formatter diff
        run: |
          dart format lib test
          git diff -- lib/features/accounting/domain/services/default_chart_of_accounts.dart
          git diff -- test/accounting/default_chart_of_accounts_test.dart
          git diff --exit-code -- lib test

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
