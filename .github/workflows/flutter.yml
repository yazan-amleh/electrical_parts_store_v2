name: Flutter checks

on:
  push:
    branches:
      - main
      - "v2/**"
      - "audit/**"
  pull_request:
    branches:
      - main
      - "v2/**"

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check functions syntax
        run: node --check functions/index.js

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: |
          dart format lib test
          if ! git diff --exit-code -- lib test; then
            echo "::error::Dart formatting differs from repository contents"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Compile the deployable Web target; compilation does not publish or
      # connect to production Firebase. Runtime Firebase E2E is a separate gate.
      - name: Build V2 Web release (no deploy)
        run: |
          flutter build web --release \
            --dart-define=USE_FIREBASE=true \
            --dart-define=FIREBASE_PROJECT_ID=electrical-store-v2-prod

      - name: Install Firestore rules test dependencies
        working-directory: firestore_rules_test
        run: npm install --no-audit --no-fund

      - name: Test Firestore security rules
        working-directory: firestore_rules_test
        run: npx firebase-tools emulators:exec --only firestore,storage --config ../firebase.json --project demo-electrical-parts-v2-rules "npm test && npm --prefix ../functions test"
