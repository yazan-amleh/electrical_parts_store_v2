name: Flutter checks

on:
  push:
    branches:
      - main
      - "v2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check functions syntax
        run: node --check functions/index.js

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: |
          dart format --output=write lib test
          git diff -- test/acceptance/clean_data_workflow_test.dart
          exit 1

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Install Firestore rules test dependencies
        working-directory: firestore_rules_test
        run: npm install --no-audit --no-fund

      - name: Test Firestore security rules
        working-directory: firestore_rules_test
        run: npx firebase-tools emulators:exec --only firestore,storage --config ../firebase.json --project demo-electrical-parts-v2-rules "npm test && npm --prefix ../functions test"
