name: Temporary Dart format probe

on:
  push:
    branches: [v2/foundation]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format --output=show lib/features/cheques/data/mappers/cheque_firestore_mapper.dart lib/features/cheques/presentation/cheques_page.dart
