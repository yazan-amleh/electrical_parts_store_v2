name: Temporary chat format diff

on:
  push:
    branches:
      - v2/foundation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format chat files and print diff
        run: |
          dart format lib/features/chat
          git diff -- lib/features/chat
