name: Temporary party ledger format probe

on:
  push:
    branches:
      - v2/foundation

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Print formatted page
        run: |
          echo "BEGIN_FORMAT"
          dart format --output=show lib/features/parties/presentation/party_ledger_page.dart
          echo "END_FORMAT"
