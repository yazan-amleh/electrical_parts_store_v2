name: Temporary Dart format diff

on:
  push:
    branches:
      - v2/foundation

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format category export files and print diff
        run: |
          dart format lib/app/bootstrap.dart lib/features/categories/data/exporters/pdf_category_inventory_document_builder.dart lib/features/categories/presentation/categories_page.dart lib/features/shell/presentation/app_shell_page.dart
          git diff -- lib/app/bootstrap.dart lib/features/categories/data/exporters/pdf_category_inventory_document_builder.dart lib/features/categories/presentation/categories_page.dart lib/features/shell/presentation/app_shell_page.dart
