name: Temporary Dart format diff

on:
  push:
    branches:
      - "v2/**"

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Print formatter diff
        run: |
          dart format lib test
          git diff --no-ext-diff -- lib/features/reports/data/repositories/firestore_reports_repository.dart lib/features/reports/presentation/sales_analytics_page.dart
