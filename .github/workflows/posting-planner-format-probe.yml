name: Temporary posting planner format probe

on:
  push:
    branches:
      - v2/foundation

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Print formatted test
        run: dart format --output=show test/transactions/posting_planners_test.dart
