name: Temporary Dart format fix

on:
  push:
    branches:
      - v2/foundation
    paths:
      - "lib/**"
      - "test/**"
      - ".github/workflows/format-fix-temporary.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: v2/foundation
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart source
        run: dart format lib test

      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Format V2 Dart source with CI stable"
          git push origin HEAD:v2/foundation
