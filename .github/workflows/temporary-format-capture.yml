name: Temporary Dart format capture

on:
  push:
    branches: [v2/foundation]

jobs:
  format-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: |
          dart format lib/features/cheques/data/mappers/cheque_firestore_mapper.dart lib/features/cheques/presentation/cheques_page.dart
          echo MAPPER_BEGIN
          base64 -w0 lib/features/cheques/data/mappers/cheque_firestore_mapper.dart
          echo
          echo MAPPER_END
          echo PAGE_BEGIN
          base64 -w0 lib/features/cheques/presentation/cheques_page.dart
          echo
          echo PAGE_END
